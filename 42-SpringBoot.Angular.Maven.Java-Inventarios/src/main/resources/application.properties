spring.application.name=inventarios

# Conexion a mariaDB
spring.datasource.url=jdbc:mariadb://localhost:3306/inventario_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=admin
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Esquema de bd
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Configurar el patron de log (en lugar de archivo logback-spring.xml)
logging.pattern.console=[%thread] %-5level: %logger - %msg%n
# Configurar el nivel de log (INFO)
loggin.level.root=INFO
# Opcional, configurar niveles por paquetes
# loggin.level.gm.inventarios=DEBUG
# loggin.level.gm.springframework=WARN
# Cambiar puerto del servidor tomcat
#server.port=8080
spring.main.banner-mode=off