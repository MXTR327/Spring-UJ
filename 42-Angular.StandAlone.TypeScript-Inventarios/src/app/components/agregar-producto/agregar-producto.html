<div class="container">
  <div class="container text-center" style="margin: 30px">
    <h3>Agregar Producto</h3>
  </div>

  <form [formGroup]="formProduct" (ngSubmit)="onSubmit()">
    <div class="row mb-3">
      <label class="col-sm-2 col-form-label" for="descripcion">
        Descripcion
      </label>
      <div class="col-sm-10">
        <input
          class="form-control"
          id="descripcion"
          type="text"
          formControlName="descripcion"
        />
      </div>
    </div>
    <div class="row mb-3">
      <label class="col-sm-2 col-form-label" for="precio">Precio</label>
      <div class="col-sm-10">
        <input
          class="form-control"
          id="precio"
          type="number"
          formControlName="precio"
          step="any"
        />
      </div>
    </div>
    <div class="row mb-3">
      <label class="col-sm-2 col-form-label" for="existencia">Existencia</label>
      <div class="col-sm-10">
        <input
          class="form-control"
          id="existencia"
          type="number"
          formControlName="existencia"
        />
      </div>
    </div>
    <div class="text-center">
      <button class="btn btn-warning btn-sm me-3" type="submit">Agregar</button>
      <a class="btn btn-danger btn-sm" href="/">Regresar</a>
    </div>
  </form>
</div>
